services:
  # Backend Node.js Service
  - type: web
    name: zoom-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        value: "<your-mongodb-connection-string>"
        # You will need to replace this with your actual MongoDB URI in the Render dashboard.
      - key: PORT
        value: 8000

